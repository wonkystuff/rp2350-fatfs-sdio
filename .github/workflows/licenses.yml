name: Licences
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 7 * * 1'
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install reuse==5.1.1
      - run: reuse lint
  inventory:
    name: Source licence inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 .github/scripts/fetch-dependencies.py
      # Keep plugin discovery and CLI flag defaults compatible with this ScanCode release.
      - run: pip install scancode-toolkit==32.4.1 pluggy==1.6.0 click==8.2.1
      - name: Scan repository and fetched sources
        run: >-
          scancode --license --copyright --package --processes 2
          --ignore '*/.git/*' --ignore '.git/*'
          --json-pp "$RUNNER_TEMP/licence-inventory.json" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-inventory
          path: ${{ runner.temp }}/licence-inventory.json
          retention-days: 14
