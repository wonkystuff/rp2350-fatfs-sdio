name: Licences
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '31 7 * * 1'
permissions:
  contents: read
jobs:
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install reuse==5.1.1
      - run: reuse lint
  inventory:
    name: Source licence inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python3 .github/scripts/fetch-dependencies.py
      # Pluggy 1.7 removes legacy hook discovery used by ScanCode plugins.
      - run: pip install scancode-toolkit==32.4.1 pluggy==1.6.0
      - name: Scan repository and fetched sources
        run: >-
          scancode --license --copyright --package --processes 2
          --ignore '*/.git/*' --ignore '.git/*'
          --json-pp "$RUNNER_TEMP/licence-inventory.json" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: licence-inventory
          path: ${{ runner.temp }}/licence-inventory.json
          retention-days: 14
